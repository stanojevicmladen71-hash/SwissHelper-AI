async function downloadResultPdf(resultId){
  const src=document.getElementById(resultId);
  const pages=[...src.querySelectorAll(".a4-page")];
  if(!pages.length)return;
  if(typeof html2pdf!=="function"){alert("PDF-Funktion konnte nicht geladen werden. Bitte Internetverbindung prüfen.");return}
  const wrapper=document.createElement("div");
  wrapper.style.background="#fff"; wrapper.style.width="210mm"; wrapper.style.margin="0"; wrapper.style.padding="0";
  pages.forEach((p,i)=>{
    const clone=p.cloneNode(true);
    clone.style.width="210mm"; clone.style.height="297mm"; clone.style.minHeight="297mm";
    clone.style.boxSizing="border-box"; clone.style.margin="0"; clone.style.padding="18mm";
    clone.style.border="0"; clone.style.boxShadow="none"; clone.style.breakAfter=i<pages.length-1?"page":"auto";
    clone.style.pageBreakAfter=i<pages.length-1?"always":"auto";
    wrapper.appendChild(clone);
  });
  document.body.appendChild(wrapper);
  try{
    await html2pdf().set({
      margin:0,filename:"SwissHelper_Ergebnis.pdf",
      image:{type:"jpeg",quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"]}
    }).from(wrapper).save();
  }finally{wrapper.remove()}
}

function normalizeFieldKey(v){return String(v||"").trim().toLowerCase().replace(/[\s_\-]+/g,"");}
function findAiField(x,aiFields){
  const byPdf=aiFields.find(a=>a.pdf_field && a.pdf_field===x.name); if(byPdf)return byPdf;
  const byField=aiFields.find(a=>a.field===x.name); if(byField)return byField;
  const nk=normalizeFieldKey(x.name), nl=normalizeFieldKey(x.label);
  return aiFields.find(a=>normalizeFieldKey(a.field)===nk || normalizeFieldKey(a.field)===nl || normalizeFieldKey(a.explanation)===nl) || null;
}
function optionTranslation(ai, opt){
  const raw=String(opt.label||opt.value||"");
  const hit=(ai&&ai.options||[]).find(o=>String(o.original||"")===String(opt.value||"") || String(o.original||"").replace(/^\//,"")===raw);
  if(hit&&hit.translation) return hit.translation;
  if(raw.includes("\ufffd")){
    const aiHit=(ai&&ai.options||[]).find(o=>!String(o.original||"").includes("\ufffd") && String(o.original||"").length>0);
    if(aiHit&&aiHit.translation) return aiHit.translation;
  }
  return raw;
}
function renderFormField(x,ai,t,idx){
  ai=ai||{};
  const rawOriginal=x.label||x.name;
  const aiOriginal=ai.field||"";
  const original=(rawOriginal && !String(rawOriginal).includes("\ufffd"))?rawOriginal:(aiOriginal||rawOriginal||x.name);
  const translation=ai.translation||ai.field||ai.explanation||original;
  const instruction=ai.what_to_enter||t.instruction;
  let control="";
  if(x.type==="checkbox"){
    const on=(x.options&&x.options[0]&&x.options[0].value)||"/Yes";
    const label=optionTranslation(ai,x.options&&x.options[0]||{value:on,label:on});
    control=`<label class="form-option"><input type="checkbox" data-pdf-field="${esc(x.name)}" data-pdf-type="checkbox" data-pdf-on="${esc(on)}"> ${esc(label)}</label>`;
  }else if(x.type==="radio"){
    const opts=x.options||[];
    control=opts.length?opts.map((o,j)=>`<label class="form-option"><input type="radio" name="radio_${esc(x.name)}" data-pdf-field="${esc(x.name)}" data-pdf-type="radio" data-pdf-value="${esc(o.value)}" ${String(x.value||"")===String(o.value||"")?"checked":""}> ${esc(optionTranslation(ai,o))}</label>`).join(""):"";
  }else if(x.type==="choice"){
    control=`<select data-pdf-field="${esc(x.name)}" data-pdf-type="choice"><option value="">—</option>${(x.options||[]).map(o=>`<option value="${esc(o.value)}" ${String(x.value||"")===String(o.value||"")?"selected":""}>${esc(optionTranslation(ai,o))}</option>`).join("")}</select>`;
  }else if(x.type!=="button"){
    control=`<input type="text" data-pdf-field="${esc(x.name)}" data-pdf-type="text" value="${esc(x.value||"")}" placeholder="${esc(ai.missing_information||"")}">`;
  }
  return `<div class="form-field"><div class="form-original-label">${esc(original)}</div><div class="form-translation">${esc(translation)}</div><p class="form-instruction">${esc(instruction)}</p>${control}</div>`;
}
function buildFormPages(d,l,focusFill){
  const t=LANGS[l]||LANGS.Deutsch, f=FORM_UI[l]||FORM_UI.Deutsch, meta=d.pdf_meta||{};
  const aiFields=d.form_fields||[];
  const aiFor=(x)=>findAiField(x,aiFields);
  const pages=meta.pages&&meta.pages.length?meta.pages.map(p=>({page:p.page,fields:p.fields||[]})):[{page:1,fields:[]}];
  if(!meta.pages||!meta.pages.length){aiFields.forEach(a=>{const p=Math.max(1,Number(a.page)||1);let pg=pages.find(x=>x.page===p);if(!pg){pg={page:p,fields:[]};pages.push(pg)}pg.fields.push({name:a.pdf_field||a.field,label:a.field,type:"text",value:"",options:[]})})}
  pages.sort((a,b)=>a.page-b.page);
  const html=pages.map((pg,i)=>{
    const b64=meta.full_pdf||"";
    const original=b64?`<iframe title="${esc(f.page+" "+pg.page)}" src="data:application/pdf;base64,${b64}#page=${pg.page}"></iframe>`:`<div class="form-page-empty">${esc(t.scanNotice||f.noFields)}</div>`;
    const fields=pg.fields.map((x,j)=>renderFormField(x,aiFor(x),f,j)).join("");
    return `<article class="form-page" data-form-page="${pg.page}"><div class="form-original"><div class="form-original-head">${esc(f.original)} — ${esc(f.page)} ${pg.page} ${esc(f.of)} ${pages.length}</div>${original}</div><div class="form-help"><div class="form-help-head">${esc(f.translation)} &amp; ${esc(t.formfill||f.instruction)}</div><div class="form-help-body">${fields||`<div class="form-page-empty">${esc(f.noFields)}</div>`}</div></div></article>`;
  }).join("");
  const status=`<div class="form-status" id="formStatus">${esc(f.page)} 1 ${esc(f.of)} ${pages.length}</div>`;
  const actions=`<div class="form-page-actions"><button type="button" class="secondary" id="formPrev">${esc(f.prev)}</button><button type="button" id="formNext">${esc(f.next)}</button></div>`;
  return `<div id="formPagesContainer">${status}${html}${actions}</div>`;
}
function wireFormPages(d,l,focusFill){
  const f=FORM_UI[l]||FORM_UI.Deutsch, pages=[...document.querySelectorAll('#formPagesContainer .form-page')]; if(!pages.length)return;
  let current=0;
  const update=()=>{pages.forEach((p,i)=>p.style.display=i===current?"grid":"none");const st=document.getElementById('formStatus');if(st)st.textContent=`${f.page} ${current+1} ${f.of} ${pages.length}`;document.getElementById('formPrev').disabled=current===0;document.getElementById('formNext').disabled=current===pages.length-1;};
  document.getElementById('formPrev').onclick=()=>{if(current>0){current--;update();window.scrollTo({top:document.getElementById('formPagesContainer').offsetTop-20,behavior:'smooth'});}};
  document.getElementById('formNext').onclick=()=>{if(current<pages.length-1){current++;update();window.scrollTo({top:document.getElementById('formPagesContainer').offsetTop-20,behavior:'smooth'});}};
  update();
  if(focusFill){
    const first=document.querySelector('#formPagesContainer input[data-pdf-field], #formPagesContainer select[data-pdf-field], #formPagesContainer textarea[data-pdf-field]');
    if(first){
      const pageEl=first.closest('.form-page');
      current=pageEl?Math.max(0,Number(pageEl.dataset.formPage)-1):0;
      update();
      setTimeout(()=>first.focus(),150);
    }
  }
}
async function formAction(action){
  const f=document.getElementById("formFile").files[0]; const l=currentUiLanguage||langSel.value; const t=LANGS[l]||LANGS.Deutsch; const fu=FORM_UI[l]||FORM_UI.Deutsch;
  if(!f){alert(t.choose);return}
  const buttons=[document.getElementById('formExplain'),document.getElementById('formFill'),document.getElementById('formMissing')]; buttons.forEach(b=>b.disabled=true);
  document.getElementById('formResult').innerHTML=`<div class="form-status">⏳ ${esc(fu.analyzing)}</div>`;
  const fd=new FormData(); fd.append("form",f); fd.append("language",l); fd.append("action",action);
  try{
    const d=await postForm("/form-helper",fd); const meta=d.pdf_meta||{fillable:false,fields:[],pages:[],page_pdfs:[],full_pdf:""};
    const compactNext=(d.next_steps||[]).slice(0,6), compactDocs=(d.required_documents||[]).slice(0,6);
    const docs=`<article class="a4-page"><h2>${esc(d.document_type||t.formResult)}</h2><p>${esc(d.simple_explanation||'')}</p>${d.next_steps?.length?`<h3>${esc(t.next)}</h3><ul>${list(compactNext)}</ul>`:''}${d.required_documents?.length?`<h3>${esc(t.required)}</h3><ul>${list(compactDocs)}</ul>`:''}</article>`;
    const notice=meta.fillable?`<div class="notice"><b>${esc(t.original1to1)}</b><br>${esc(t.original1to1Desc)}</div>`:`<div class="notice">${esc(t.scanNotice||'Das Original wird angezeigt. Automatisches Ausfüllen ist nur möglich, wenn echte PDF-Felder vorhanden sind.')}</div>`;
    document.getElementById('formResult').innerHTML=docs+notice+buildFormPages(d,l,action==='fill');
    wireFormPages(d,l,action==='fill');
    if(meta.fillable){
      const btn=document.createElement('button'); btn.id='downloadFilled'; btn.type='button'; btn.textContent='📥 '+(t.fillPdf||'Ausgefülltes PDF erstellen'); btn.style.margin='14px auto'; btn.style.display='block';
      document.getElementById('formResult').appendChild(btn);
      btn.onclick=async()=>{
        const values={}; document.querySelectorAll('#formResult [data-pdf-field]').forEach(el=>{const name=el.dataset.pdfField;if(el.dataset.pdfType==='checkbox')values[name]=el.checked?(el.dataset.pdfOn||'/Yes'):'/Off';else if(el.dataset.pdfType==='radio'){if(el.checked)values[name]=el.dataset.pdfValue;}else values[name]=el.value;});
        btn.disabled=true; btn.textContent='⏳ '+fu.creating;
        const fd2=new FormData(); fd2.append('form',f); fd2.append('field_values',JSON.stringify(values));
        try{const r=await fetch('/fill-form',{method:'POST',body:fd2});if(!r.ok){let msg=fu.noFields;try{const x=await r.json();msg=x.error||msg}catch(e){}throw Error(msg)}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SwissHelper_Originalformular_ausgefuellt.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert(e.message)}finally{btn.disabled=false;btn.textContent='📥 '+(t.fillPdf||'Ausgefülltes PDF erstellen')}
      };
    }
  }catch(e){alert(e.message);document.getElementById('formResult').innerHTML=''} finally{buttons.forEach(b=>b.disabled=false)}
}
