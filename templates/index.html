function doNativePrint(resultId){const src=document.getElementById(resultId);const pages=[...src.querySelectorAll(".a4-page")];const area=document.getElementById("printArea");area.innerHTML=pages.map(p=>`<article class="a4-page">${p.innerHTML}</article>`).join("");closePrintPreview();window.print();setTimeout(()=>area.innerHTML="",1000)}
function resultSection(title,content){return `<section class="section"><h3>${esc(title)}</h3>${content}</section>`}
function links(forms){return (forms||[]).map(f=>`<a class="form-link" href="${esc(f.url)}" target="_blank" rel="noopener">📥 ${esc(f.name)}</a>`).join("")}

document.getElementById("analyzeButton").onclick=async()=>{const f=document.getElementById("documentFile").files[0];const t=LANGS[langSel.value]||LANGS.Deutsch;if(!f){alert(t.choose);return}const fd=new FormData();fd.append("document",f);fd.append("language",langSel.value);try{const d=await postForm("/analyze",fd);const follow=`<div class="actions"><button type="button" onclick="document.getElementById('formModule').scrollIntoView({behavior:'smooth'})">${esc(t.formfill)}</button><button type="button" onclick="document.getElementById('translationOpenButton').click();document.getElementById('translationModule').scrollIntoView({behavior:'smooth'})">${esc(t.translation)}</button></div>`;showResult("analyzeResult",`<div class="a4-page"><h2>${esc(d.document_type||t.result)}</h2>${resultSection(t.sender||"",`<p>${esc(d.sender||"—")}</p>`)}${resultSection(t.purpose,`<p>${esc(d.topic||"—")}</p>`)}${resultSection(t.next,list(d.next_steps))}${resultSection(t.required,list(d.required_documents))}${resultSection(t.notes,list(d.warnings))}<p>${esc(d.simple_explanation||"")}</p>${follow}</div>`)}catch(e){alert(e.message)}};

document.getElementById("translationOpenButton").onclick=()=>document.getElementById("translationModule").classList.remove("hidden");
document.getElementById("translateButton").onclick=async()=>{const f=document.getElementById("translationFile").files[0];const t=LANGS[langSel.value]||LANGS.Deutsch;if(!f){alert(t.choose);return}const fd=new FormData();fd.append("translationFile",f);fd.append("target_language",document.getElementById("translationLanguage").value);fd.append("source_country",document.getElementById("sourceCountry").value);fd.append("target_country",document.getElementById("targetCountry").value);fd.append("purpose",document.getElementById("translationPurpose").value);try{const d=await postForm("/translate-document",fd);showResult("translationResult",`<div class="a4-page"><h2>${esc(d.title||t.translationPage)}</h2><h3>${esc(t.translationPage)}</h3><div style="white-space:pre-wrap">${esc(d.translation||"")}</div></div><div class="a4-page"><h2>${esc(d.legal_title||t.page2)}</h2><p>${esc(d.legal_requirements||"")}</p><h3>${esc(t.next)}</h3><ul>${list(d.next_steps)}</ul><h3>${esc(d.source_title||t.sourceInfo)}</h3><ul class="source-list">${list(d.sources)}</ul></div>`)}catch(e){alert(e.message)}};
document.getElementById("newTranslationButton").onclick=()=>resetModule("translationModule");

async function formAction(action){const f=document.getElementById("formFile").files[0];const t=LANGS[langSel.value]||LANGS.Deutsch;if(!f){alert(t.choose);return}const fd=new FormData();fd.append("form",f);fd.append("language",langSel.value);fd.append("action",action);try{const d=await postForm("/form-helper",fd);const meta=d.pdf_meta||{fillable:false,fields:[]};const aiByField=Object.fromEntries((d.form_fields||[]).map(x=>[x.field,x]));let fieldsHtml="";if(meta.fillable&&meta.fields.length){fieldsHtml=meta.fields.map(x=>{const ai=aiByField[x.name]||{};const label=ai.explanation?`${x.label} – ${ai.explanation}`:x.label;let control="";if(x.type==="checkbox"){control=`<label><input type="checkbox" data-pdf-field="${esc(x.name)}" data-pdf-type="checkbox" data-pdf-on="${esc((x.options&&x.options[0]&&x.options[0].value)||"/Yes")}"> ${esc(label)}</label>`}else if(x.type==="radio"||x.type==="choice"){control=`<label>${esc(label)}<select data-pdf-field="${esc(x.name)}" data-pdf-type="choice"><option value="">—</option>${(x.options||[]).map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("")}</select></label>`}else if(x.type!=="button"){control=`<label>${esc(label)}<input type="text" data-pdf-field="${esc(x.name)}" data-pdf-type="text" value="${esc(x.value||"")}" placeholder="${esc(ai.missing_information||"")}"></label>`}else{return ""}return `<div class="item"><div class="small">PDF-Feld: ${esc(x.name)}</div>${control}</div>`}).join("")}else{fieldsHtml=(d.form_fields||[]).map((x,i)=>`<div class="item"><b>${esc(x.field)}</b><p>${esc(x.explanation)}</p><p><b>${esc(t.required)}:</b> ${esc(x.what_to_enter)}</p><label>${esc(t.notes)}<input type="text" data-ai-field-index="${i}" placeholder="${esc(x.missing_information||"")}"></label></div>`).join("")};const fillButton=meta.fillable?`<div class="actions"><button id="downloadFilled" type="button">${esc(t.fillPdf)}</button></div>`:"";const metaNotice=meta.fillable?`<div class="notice"><b>${esc(t.original1to1)}</b><br>${esc(t.original1to1Desc)}</div>`:`<p class="small">${esc(t.scanNotice)}</p>`;showResult("formResult",`<div class="a4-page"><h2>${esc(d.document_type||t.formResult)}</h2><p>${esc(d.simple_explanation||"")}</p>${metaNotice}<h3>${esc(t.next)}</h3><ul>${list(d.next_steps)}</ul><h3>${esc(t.required)}</h3><ul>${list(d.required_documents)}</ul>${fieldsHtml}${fillButton}<p class="small">${esc(t.scanNotice)}</p></div>`);if(meta.fillable){document.getElementById("downloadFilled").onclick=async()=>{const values={};document.querySelectorAll("#formResult [data-pdf-field]").forEach(el=>{values[el.dataset.pdfField]=el.dataset.pdfType==="checkbox"?(el.checked?(el.dataset.pdfOn||"/Yes"):"/Off"):el.value});const fd2=new FormData();fd2.append("form",f);fd2.append("field_values",JSON.stringify(values));const r=await fetch("/fill-form",{method:"POST",body:fd2});if(!r.ok){let msg=t.scanNotice;try{const x=await r.json();msg=x.error||msg}catch(e){}alert(msg);return}const blob=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="SwissHelper_Originalformular_ausgefuellt.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}}catch(e){alert(e.message)}}
document.getElementById("formExplain").onclick=()=>formAction("explain");document.getElementById("formFill").onclick=()=>formAction("fill");document.getElementById("formMissing").onclick=()=>formAction("missing");document.getElementById("newForm").onclick=()=>resetModule("formModule");

async function runHelper(){const payload={source_country:document.getElementById("countryOrigin").value,target_country:document.getElementById("countryTarget").value,source_place:document.getElementById("countryOriginPlace").value,target_place:document.getElementById("countryTargetPlace").value,nationality:document.getElementById("countryNationality").value,purpose:document.getElementById("countryPurpose").value,language:langSel.value};try{const d=await postForm("/country-helper",new Blob([JSON.stringify(payload)],{type:"application/json"}));showResult("countryResult",`<div class="a4-page"><h2>${esc(d.title)}</h2><p>${esc(d.summary)}</p><h3>${esc(d.next_title||LANGS[langSel.value].next)}</h3><ul>${list(d.steps)}</ul><h3>${esc(d.docs_title||LANGS[langSel.value].required)}</h3><ul>${list(d.documents)}</ul>${d.forms?.length?`<h3>${esc(LANGS[langSel.value].forms)}</h3>${links(d.forms)}`:''}<h3>${esc(d.source_title||LANGS[langSel.value].source)}</h3><ul>${list(d.sources)}</ul></div>`)}catch(e){alert(e.message)}}
// JSON helper uses a small wrapper so the same error handling is used everywhere.
async function postJson(url,payload){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||"Fehler");return d}
document.getElementById("countryRun").onclick=async()=>{const payload={source_country:document.getElementById("countryOrigin").value,target_country:document.getElementById("countryTarget").value,source_place:document.getElementById("countryOriginPlace").value,target_place:document.getElementById("countryTargetPlace").value,nationality:document.getElementById("countryNationality").value,purpose:document.getElementById("countryPurpose").value,language:langSel.value};try{const d=await postJson("/country-helper",payload);const t=LANGS[langSel.value]||LANGS.Deutsch;showResult("countryResult",`<div class="a4-page"><h2>${esc(d.title||t.result)}</h2><p>${esc(d.summary||"")}</p><h3>${esc(t.next)}</h3><ul>${list(d.steps)}</ul><h3>${esc(t.required)}</h3><ul>${list(d.documents)}</ul>${d.forms?.length?`<h3>${esc(t.forms)}</h3>${links(d.forms) }`:''}<h3>${esc(t.source)}</h3><ul>${list(d.sources)}</ul></div>`)}catch(e){alert(e.message)}};

document.getElementById("tourRun").onclick=async()=>{const payload={origin:document.getElementById("tourOrigin").value,origin_place:document.getElementById("tourOriginPlace").value,destination:document.getElementById("tourCountry").value,destination_place:document.getElementById("tourDestinationPlace").value,purpose:document.getElementById("tourPurpose").value,duration:document.getElementById("tourDuration").value,residence:document.getElementById("tourStay").value,language:langSel.value};try{const d=await postJson("/tourism-helper",payload);const t=LANGS[langSel.value]||LANGS.Deutsch;showResult("tourResult",`<div class="a4-page"><h2>${esc(d.title||t.result)}</h2><p>${esc(d.summary||"")}</p><h3>${esc(t.next)}</h3><ul>${list(d.entry)}</ul><h3>${esc(t.required)}</h3><ul>${list(d.documents)}</ul>${d.forms?.length?`<h3>${esc(t.forms)}</h3>${links(d.forms)}`:''}<h3>${esc(t.source)}</h3><ul>${list(d.sources)}</ul></div>`)}catch(e){alert(e.message)}};


function resetModule(id){const s=document.getElementById(id);s.querySelectorAll('input[type="file"]').forEach(x=>x.value="");s.querySelectorAll('input[type="text"],textarea').forEach(x=>x.value="");s.querySelectorAll('[id$="Result"]').forEach(x=>x.innerHTML="");if(id==="translationModule")s.classList.add("hidden")}
</script></body></html>
