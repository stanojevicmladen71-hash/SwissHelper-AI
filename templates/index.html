<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SwissHelper AI</title>
<style>
:root{--accent:#087f86;--bg:#eef8f8;--text:#17333b;--muted:#64777c;--line:#c9dadd;--soft:#f4fbfb}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);margin:0;color:var(--text)}
.wrap{max-width:1050px;margin:20px auto;padding:14px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-bottom:18px}
h1,h2,h3{margin-top:0}p{line-height:1.5}.small{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
label{display:block;font-weight:700;margin-bottom:6px}select,input[type=text],textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
button{padding:11px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e8f1f2;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.6}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:190px}
.hidden{display:none!important}.item,.notice{padding:14px;background:var(--soft);border-radius:10px;margin:8px 0}.warning{background:#fff7e6}
.a4-preview{width:210mm;min-height:297mm;max-width:100%;margin:18px auto;padding:20mm 18mm;background:#fff;border:1px solid #d8e3e8;line-height:1.55}
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--line);padding:10px;border-radius:10px}
.filebox input{display:none}.filebutton{background:#e8f1f2;color:var(--text);border:1px solid var(--line);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
.module-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.xbtn{background:#eee;color:#17333b;border:1px solid #ddd;padding:6px 10px}
.package-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.package{border:1px solid var(--line);border-radius:14px;padding:16px}
@media(max-width:760px){.grid2,.grid3,.package-grid{grid-template-columns:1fr}.actions button{min-width:100%}}
</style>
</head>
<body>
<div class="wrap">
<section class="card">
<div class="module-head"><div><h1>SwissHelper AI</h1><p id="subtitle"></p></div>
<div style="min-width:230px"><label id="languageLabel" for="languageSelect">Sprache</label><select id="languageSelect"></select></div></div>
<p id="intro"></p>
</section>

<section class="card" id="documentModule">
<div class="module-head"><h2 id="documentTitle">Dokument</h2><button class="xbtn" onclick="resetModule('documentModule')">✕</button></div>
<div class="grid grid2">
<div><label id="docLabel"></label><div class="filebox"><label class="filebutton" for="documentFile" id="documentFileButton"></label><input id="documentFile" type="file" accept=".pdf,image/jpeg,image/png,image/webp"><span id="documentFileName" class="small"></span></div></div>
<div><label id="documentLangLabel">Sprache</label><div class="notice" id="documentLangNotice"></div></div>
</div>
<div class="actions"><button id="analyzeButton"></button><button id="translationOpenButton"></button></div>
<div id="analyzeResult"></div>
</section>

<section class="card hidden" id="translationModule">
<div class="module-head"><h2 id="translationTitle"></h2><button class="xbtn" onclick="resetModule('translationModule')">✕</button></div>
<p id="translationIntro"></p>
<div class="grid grid3"><div><label id="originLabel"></label><select id="sourceCountry"></select></div><div><label id="targetLabel"></label><select id="targetCountry"></select></div><div><label id="purposeLabel"></label><select id="translationPurpose"></select></div></div>
<div style="margin-top:12px"><label id="translationLangLabel"></label><select id="translationLanguage"></select></div>
<div style="margin-top:12px"><label id="translationDocLabel"></label><div class="filebox"><label class="filebutton" for="translationFile" id="translationFileButton"></label><input id="translationFile" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"><span id="translationFileName" class="small"></span></div></div>
<div class="actions"><button id="translateButton"></button><button class="secondary" id="newTranslationButton"></button></div>
<div id="translationResult"></div>
</section>

<section class="card" id="formModule">
<div class="module-head"><div><h2 id="formTitle"></h2><p id="formDesc"></p></div><button class="xbtn" onclick="resetModule('formModule')">✕</button></div>
<label id="formFileLabel"></label><div class="filebox"><label class="filebutton" for="formFile" id="formFileButton"></label><input id="formFile" type="file" accept=".pdf,image/jpeg,image/png,image/webp"><span id="formFileName" class="small"></span></div>
<div class="actions"><button id="formExplain"></button><button id="formFill"></button><button id="formMissing"></button><button class="secondary" id="newForm"></button></div>
<div id="formResult"></div>
</section>

<section class="card" id="countryModule">
<div class="module-head"><div><h2 id="countryTitle"></h2><p id="countryDesc"></p></div><button class="xbtn" onclick="resetModule('countryModule')">✕</button></div>
<div class="grid grid2"><div><label id="countryOriginLabel"></label><select id="countryOrigin"></select></div><div><label id="countryTargetLabel"></label><select id="countryTarget"></select></div><div><label id="countryNationalityLabel"></label><input id="countryNationality" type="text"></div><div><label id="countryPurposeLabel"></label><select id="countryPurpose"></select></div></div>
<div class="actions"><button id="countryRun"></button></div><div id="countryResult"></div>
</section>

<section class="card" id="tourismModule">
<div class="module-head"><div><h2 id="tourismTitle"></h2><p id="tourismIntro"></p></div><button class="xbtn" onclick="resetModule('tourismModule')">✕</button></div>
<div class="grid grid2"><div><label id="tourOriginLabel"></label><select id="tourOrigin"></select></div><div><label id="tourCountryLabel"></label><select id="tourCountry"></select></div><div><label id="tourPurposeLabel"></label><select id="tourPurpose"></select></div><div><label id="tourDurationLabel"></label><input id="tourDuration" type="text"></div><div><label id="tourStayLabel"></label><input id="tourStay" type="text"></div></div>
<div class="actions"><button id="tourRun"></button></div><div id="tourResult"></div>
</section>

<section class="card" id="packagesModule">
<div class="module-head"><h2 id="packagesTitle"></h2><button class="xbtn" onclick="resetModule('packagesModule')">✕</button></div>
<div class="package-grid"><div class="package"><h3 id="freeTitle"></h3><p id="freeText"></p></div><div class="package"><h3 id="plusTitle"></h3><p id="plusText"></p></div><div class="package"><h3 id="proTitle"></h3><p id="proText"></p></div></div>
</section>
</div>

document.getElementById("analyzeButton").onclick=async()=>{const f=document.getElementById("documentFile").files[0];if(!f){alert((LANGS[langSel.value]||LANGS.Deutsch).choose);return};const fd=new FormData();fd.append("document",f);fd.append("language",langSel.value);try{const d=await postForm("/analyze",fd);document.getElementById("analyzeResult").innerHTML=`<div class="a4-preview"><h2>${esc(d.document_type||"Ergebnis")}</h2><p><b>Absender:</b> ${esc(d.sender)}</p><p><b>Thema:</b> ${esc(d.topic)}</p><p><b>Frist:</b> ${esc(d.deadline||"—")}</p><h3>${esc((LANGS[langSel.value]||LANGS.Deutsch).next)}</h3><ul>${list(d.next_steps)}</ul><h3>${esc((LANGS[langSel.value]||LANGS.Deutsch).required)}</h3><ul>${list(d.required_documents)}</ul><h3>${esc((LANGS[langSel.value]||LANGS.Deutsch).notes)}</h3><ul>${list(d.warnings)}</ul><p>${esc(d.simple_explanation)}</p></div>`}catch(e){alert(e.message)}};

document.getElementById("translateButton").onclick=async()=>{const f=document.getElementById("translationFile").files[0];if(!f){alert("Bitte zuerst ein Dokument auswählen.");return};const fd=new FormData();fd.append("translationFile",f);fd.append("target_language",document.getElementById("translationLanguage").value);fd.append("source_country",document.getElementById("sourceCountry").value);fd.append("target_country",document.getElementById("targetCountry").value);fd.append("purpose",document.getElementById("translationPurpose").value);try{const d=await postForm("/translate-document",fd);document.getElementById("translationResult").innerHTML=`<div class="a4-preview"><h2>${esc(d.title)}</h2><p>${esc(d.translation)}</p><h3>${esc(d.legal_title)}</h3><p>${esc(d.legal_requirements)}</p><h3>${esc(d.next_title)}</h3><ul>${list(d.next_steps)}</ul><h3>${esc(d.source_title)}</h3><ul>${list(d.sources)}</ul></div>`}catch(e){alert(e.message)}};
document.getElementById("newTranslationButton").onclick=()=>resetModule("translationModule");
async function formAction(action){const f=document.getElementById("formFile").files[0];if(!f){alert((LANGS[langSel.value]||LANGS.Deutsch).form);return};const fd=new FormData();fd.append("form",f);fd.append("language",langSel.value);fd.append("action",action);try{const d=await postForm("/form-helper",fd);let fields=(d.form_fields||[]).map((x,i)=>`<div class="item"><b>${esc(x.field)}</b><p>${esc(x.explanation)}</p><p><b>${esc((LANGS[langSel.value]||LANGS.Deutsch).required)}:</b> ${esc(x.what_to_enter)}</p><label>${esc((LANGS[langSel.value]||LANGS.Deutsch).notes)}<input type="text" data-field-index="${i}" placeholder="${esc(x.missing_information||"")}"></label></div>`).join("");document.getElementById("formResult").innerHTML=`<div class="a4-preview"><h2>${esc(d.document_type||"Formular")}</h2><p>${esc(d.simple_explanation||"")}</p><h3>${esc((LANGS[langSel.value]||LANGS.Deutsch).next)}</h3><ul>${list(d.next_steps)}</ul><h3>${esc((LANGS[langSel.value]||LANGS.Deutsch).required)}</h3><ul>${list(d.required_documents)}</ul>${fields}<button id="downloadFilled" type="button">📥 Ausgefüllte PDF erstellen</button></div>`;document.getElementById("downloadFilled").onclick=async()=>{const vals=[...document.querySelectorAll("#formResult [data-field-index]")].map(x=>x.value);const fd2=new FormData();fd2.append("form",f);fd2.append("values",JSON.stringify(vals));fd2.append("field_names",JSON.stringify((d.form_fields||[]).map(x=>x.field)));const r=await fetch("/fill-form",{method:"POST",body:fd2});if(!r.ok){alert("Das Formular ist möglicherweise kein ausfüllbares PDF. Für Scans bleibt die Feld-für-Feld-Hilfe verfügbar.");return}const blob=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="SwissHelper_ausgefuelltes_Formular.pdf";a.click()}}}catch(e){alert(e.message)}}
document.getElementById("formExplain").onclick=()=>formAction("explain");document.getElementById("formFill").onclick=()=>formAction("fill");document.getElementById("formMissing").onclick=()=>formAction("missing");document.getElementById("newForm").onclick=()=>resetModule("formModule");
async function runHelper(){const payload={source_country:document.getElementById("countryOrigin").value,target_country:document.getElementById("countryTarget").value,nationality:document.getElementById("countryNationality").value,purpose:document.getElementById("countryPurpose").value,language:langSel.value};try{const r=await fetch("/country-helper",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||"Fehler");document.getElementById("countryResult").innerHTML=`<div class="a4-preview"><h2>${esc(d.title)}</h2><p>${esc(d.summary)}</p><h3>${esc(d.next_title)}</h3><ul>${list(d.steps)}</ul><h3>${esc(d.docs_title)}</h3><ul>${list(d.documents)}</ul><h3>${esc(d.source_title)}</h3><ul>${list(d.sources)}</ul></div>`}catch(e){alert(e.message)}}
document.getElementById("countryRun").onclick=runHelper;
document.getElementById("tourRun").onclick=async()=>{const payload={origin:document.getElementById("tourOrigin").value,destination:document.getElementById("tourCountry").value,purpose:document.getElementById("tourPurpose").value,duration:document.getElementById("tourDuration").value,residence:document.getElementById("tourStay").value,language:langSel.value};try{const r=await fetch("/tourism-helper",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error||"Fehler");document.getElementById("tourResult").innerHTML=`<div class="a4-preview"><h2>${esc(d.title)}</h2><p>${esc(d.summary)}</p><h3>${esc(d.entry_title)}</h3><ul>${list(d.entry)}</ul><h3>${esc(d.docs_title)}</h3><ul>${list(d.documents)}</ul><h3>${esc(d.source_title)}</h3><ul>${list(d.sources)}</ul></div>`}catch(e){alert(e.message)}};
function resetModule(id){const s=document.getElementById(id);s.querySelectorAll('input[type="file"]').forEach(x=>{x.value="";});s.querySelectorAll('input[type="text"],textarea').forEach(x=>x.value="");s.querySelectorAll('[id$="Result"]').forEach(x=>x.innerHTML="");if(id==="translationModule")s.classList.add("hidden")}
</script>
</body></html>
